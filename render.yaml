services:
  - type: web
    name: agrogenix-app
    env: python
    plan: free
    pythonVersion: 3.11
    buildCommand: npm install && npm run build && pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn -w 4 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: NODE_ENV
        value: production
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
