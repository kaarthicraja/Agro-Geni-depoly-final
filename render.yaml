services:
  - type: web
    name: agrogenix-app
    env: python
    plan: free
    pythonVersion: 3.11
    buildCommand: npm install && npm run build && pip install -r backend/requirements.txt
    startCommand: gunicorn wsgi:app -w 4 -b 0.0.0.0:$PORT
      - key: NODE_ENV
        value: production
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
